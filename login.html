<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Anita Mishel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cliente.css">
</head>
<body class="login-body">

    <div class="login-wrap">
        <div class="login-card">
            <a href="index.html" class="login-logo">Anita Mishel</a>
            <p class="login-tagline">Área de clientes</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" autocomplete="username" required placeholder="Tu usuario">
                </div>
                <div class="form-group">
                    <label for="clave">Clave</label>
                    <input type="password" id="clave" autocomplete="current-password" required placeholder="Tu clave">
                </div>

                <p class="login-error" id="loginError" hidden>Usuario o clave incorrectos.</p>

                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>

            <a href="index.html" class="login-back">← Volver al inicio</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
